<title>MGP Inventory</title>
<style>
:root{--bg:#eef3f9;--card:#fff;--tx:#14202b;--mut:#64748b;--bd:#e3eaf2;--red:#e5383b;--redl:#ffe9e9;--grn:#1f9d55;--grnl:#e1f7ea;--amb:#e8590c;--ambl:#fff0e0;--ac:#0077b6;--ac2:#005a8c;--acl:#e3f2fb;--ga:#0077b6;--gb:#00b4d8}
body.t-inward{--ac:#1f9d55;--ac2:#157a41;--acl:#e1f7ea;--ga:#15803d;--gb:#34c26b}
body.t-sales{--ac:#e8590c;--ac2:#b8440a;--acl:#fff0e0;--ga:#ea580c;--gb:#f59e0b}
body.t-settings{--ac:#7048e8;--ac2:#5530c4;--acl:#efeaff;--ga:#6d28d9;--gb:#a78bfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{background:linear-gradient(180deg,var(--acl) 0,var(--bg) 260px) no-repeat,var(--bg);min-height:100vh}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,var(--ga),var(--gb));color:#fff;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
header .logo{width:36px;height:36px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.28)}
header .hd{flex:1;min-width:0}
header .ttl{font-size:17px;font-weight:800;letter-spacing:.2px}
header .sub{font-size:11px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:16px;padding:6px 11px;font-size:11px;font-weight:600}
.sync .dot{width:9px;height:9px;border-radius:50%;background:#cbd5e1}
.sync.ok .dot{background:#86efac;box-shadow:0 0 0 3px rgba(134,239,172,.35)}.sync.busy .dot{background:#fde047}.sync.err .dot{background:#fca5a5}
.av{width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:var(--ac2);font-weight:800;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.22)}

<script>
'use strict';
/* ================= CONSTANTS ================= */
const APP_NAME='MGP Inventory';
const APP_VERSION='v2.5';
const LAST_UPDATED='28 Oct 2026';
// Paste the Apps Script /exec URL here once deployed. A value here ALWAYS overrides anything saved on the phone.
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbxS5V9Ny5tJ-sDIddsDiJfCQBWGcZ_RP6c89Fx0QZ_af1XyaZEibKo5oBSlw4mcTq-5/exec';
const SHEET_URL='https://docs.google.com/spreadsheets/d/1cewCwnJ39BVsEThSOM1wE8pivZ0Fxk0PppGB534kfy4/edit';
const API_KEY='mgpinv2026';            // must match API_KEY in Code.gs
const GOOGLE_CLIENT_ID='';             // optional: OAuth web client ID enables "Sign in with Google"
const DEFAULT_SETTINGS_PW='admin1234';
// Built-in users (change or add more in Settings > Users). 'guest' can only see the Stock screen.
const SEED_USERS=[['Bonny','Bonny','admin','Bonny@2026'],['Anandu','Anandu','entry','Anandu@2026'],['Vivek','Vivek','entry','Vivek@2026'],['guest','Guest','stock','guest']];
// Built-in logins/passwords carry this time. It is newer than the older defaults already sitting in the Sheet (so the new ones win)
// and older than anything edited inside the app (so a later change in Settings always wins).
const SEED_TS='2026-10-27T00:00:00.000Z';
const SETTINGS_VERSION=2;
const LS_KEY='mgpinv_db_v1';
const SES_KEY='mgpinv_session';
const LOCK_MS=60*60*1000; // password is asked again every hour
const LOG_KEEP=1500; // newest log rows kept on this phone; the Sheet keeps the full archive
const FULL_SYNC_MS=5*60*1000;     // a complete pull and reconcile at least this often
const SINCE_MARGIN_MS=15*60*1000; // incremental pulls overlap by this much, so a phone whose clock
                                  // runs slow still gets picked up rather than being skipped
const EPOCH='1970-01-01T00:00:00.000Z';
const FG=['F230','F240','F280','F320','F360','F400','F500','F600','F800','F1000','F1200','F1500'];
const PG=['P240','P280','P320','P360','P400','P500','P600','P800','P1000','P1200','P1500','P2000','P2500','P3000'];
const JET=['P280 JET','P320 JET','P360 JET','P400 JET','P500 JET'];
// Base materials and the grits allowed under each. Editors/admin can add more in the Materials tab.
const DEFAULT_MAP={
  'WFA':[...FG,...PG,...JET],
  'BFA':[...FG,...PG,...JET,'P1000 JET','P1200 JET'],
  'WFA REF':['200F','325F','90 µm'],
  'USFC':[...PG,...JET],
  'BSFC':['P240','P320','P500','P280G1','P360G1'],
  'MCZ':['3.2-3.6 µm','3.4 µm','325F','6 µm','5 µm','200F']
};
const DEFAULT_BM=Object.keys(DEFAULT_MAP);
const SEED_TS2='2026-10-27T00:00:01.000Z'; // newer than old seeds, older than any real edit
const ROLES={admin:'Admin',entry:'Editor',view:'View only',stock:'Stock view only'};
const KIND={
  sales:{name:'Sale Entry',short:'Sale',icon:'📤',sign:-1,types:['Sale','Sample / Trial','Scrap / Adjustment'],code:'SALE'},
  inward:{name:'Production Entry',short:'Production',icon:'🏭',sign:1,types:['Production'],code:'PRODUCTION'}
};
const SCHEMA={
  Inward:{k:'inward',cols:[['ID','id'],['DATE','date'],['BASE MATERIAL','bm'],['GRADE','grade'],['QTY KG','qty'],['TYPE','type'],['BATCH NO','batch'],['LINE','line'],['REMARKS','rem'],['USER','user'],['UPDATED','upd'],['DELETED','del']]},
  Sales:{k:'sales',cols:[['ID','id'],['DATE','date'],['BASE MATERIAL','bm'],['GRADE','grade'],['QTY KG','qty'],['TYPE','type'],['CUSTOMER','cust'],['INVOICE NO','inv'],['REMARKS','rem'],['USER','user'],['UPDATED','upd'],['DELETED','del'],['BATCH NO','batch']]},
  Users:{k:'users',cols:[['ID','id'],['NAME','name'],['ROLE','role'],['PIN HASH','pin'],['ACTIVE','active'],['UPDATED','upd'],['DELETED','del']]},
  Config:{k:'config',cols:[['KEY','id'],['VALUE','val'],['UPDATED','upd']]},
  Log:{k:'log',cols:[['ID','id'],['TIMESTAMP','ts'],['USER','user'],['ACTION','action'],['TARGET','target'],['DETAILS','det']]}
};
const NUMF={qty:1,del:1,active:1};


/* ================= SHA-256 (sync, works on file:// too) ================= */
const SHA={K:[],H:[]};
(function(){let n=2,c=0;const fr=x=>((x-Math.floor(x))*4294967296)|0;
  while(c<64){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}
    if(p){if(c<8)SHA.H[c]=fr(Math.sqrt(n));SHA.K[c]=fr(Math.cbrt(n));c++}n++}})();
function sha256(s){
  const m=unescape(encodeURIComponent(s)),l=m.length,w=[];
  for(let i=0;i<l;i++)w[i>>2]|=m.charCodeAt(i)<<(24-(i%4)*8);
  w[l>>2]|=0x80<<(24-(l%4)*8);
  w[(((l+8)>>6)+1)*16-1]=l*8;
  const ror=(x,n)=>(x>>>n)|(x<<(32-n));
  let h=SHA.H.slice();
  for(let j=0;j<w.length;j+=16){
    const x=new Array(64);let[a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      if(i<16)x[i]=w[j+i]|0;else{
        const s0=ror(x[i-15],7)^ror(x[i-15],18)^(x[i-15]>>>3),s1=ror(x[i-2],17)^ror(x[i-2],19)^(x[i-2]>>>10);
        x[i]=(x[i-16]+s0+x[i-7]+s1)|0}
      const S1=ror(e,6)^ror(e,11)^ror(e,25),ch=(e&f)^(~e&g),t1=(hh+S1+ch+SHA.K[i]+x[i])|0;
      const S0=ror(a,2)^ror(a,13)^ror(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
    h=[h[0]+a|0,h[1]+b|0,h[2]+c|0,h[3]+d|0,h[4]+e|0,h[5]+f|0,h[6]+g|0,h[7]+hh|0]}
  return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}
const hashPin=(id,pin)=>sha256('mgpinv:'+String(id).toLowerCase()+':'+pin);
const hashPw=pw=>sha256('mgpinv:settings:'+pw);

/* ================= STATE ================= */
const App={};
let DB,ME=null,TAB='stock',SUB='users',SET_OK=false,MAT_OK=false,LOGIN_AT=0,LOCKED=false,DEFERRED=null;
const SYNC={busy:false,timer:null,sent:new Map(),inflight:null};
const SKEW_MS=2*60*1000;  // warn once the phone's clock is this far off the Sheet's
let SKEW=0,SKEW_WARNED=false;
// REV is the Sheet's revision stamp as of our last pull: while it does not move, nothing has
// changed and there is nothing to fetch. LEGACY means the deployed Code.gs is older than v2.5
// and knows none of this, so we fall back to pulling everything every time.
let REV='',LAST_FULL=0,LEGACY=false;
const UI={openBm:new Set(),openG:new Set(),
  stock:{bm:'',g:''},
  filt:{sales:{q:'',from:'',to:'',lim:50},inward:{q:'',from:'',to:'',lim:50}},
  logf:{act:'',q:'',lim:100}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
// one repaint after a burst of typing instead of one per character
function debounce(fn,ms){let t;return function(){const a=arguments,c=this;clearTimeout(t);t=setTimeout(()=>fn.apply(c,a),ms==null?120:ms)}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fdate(s){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?(+m[3])+' '+MON[+m[2]-1]+' '+m[1]:esc(s)}
function ftime(iso){const d=new Date(iso);if(isNaN(d))return esc(iso);return d.getDate()+' '+MON[d.getMonth()]+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
const r3=x=>Math.round(x*1000)/1000;
// built once: fmtQty runs hundreds of times per repaint, and a fresh formatter each time is slow
const NF=(function(){try{return{kg:new Intl.NumberFormat('en-IN',{maximumFractionDigits:3}),
  mt:new Intl.NumberFormat('en-IN',{minimumFractionDigits:0,maximumFractionDigits:3})}}catch(e){return null}})();
function fmtQty(kg,force){
  const u=force||DB.ui.unit;
  if(u==='mt'){const v=r3(kg/1000);return(NF?NF.mt.format(v):v.toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:3}))+' MT'}
  const v=r3(kg);return(NF?NF.kg.format(v):v.toLocaleString('en-IN',{maximumFractionDigits:3}))+' kg';}
function toast(msg,type){const t=$('toast');t.className=type||'';t.firstChild.textContent=msg;t.style.display='flex';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',type==='err'?4200:2600)}
function openModal(html){$('mbox').innerHTML=html;$('modal').style.display='flex'}
App.closeModal=function(){$('modal').style.display='none';$('mbox').innerHTML=''};
const modalOpen=()=>$('modal').style.display==='flex';

/* ================= DATABASE (localStorage cache) ================= */
const seedUsers=()=>SEED_USERS.map(s=>({id:s[0],name:s[1],role:s[2],pin:hashPin(s[0],s[3]),active:1,upd:SEED_TS,del:0}));
function blankDB(){return{sv:SETTINGS_VERSION,inward:[],sales:[],users:seedUsers(),log:[],
  config:[{id:'baseMaterials',val:JSON.stringify(DEFAULT_BM),upd:SEED_TS2},{id:'pwHash',val:hashPw(DEFAULT_SETTINGS_PW),upd:SEED_TS}],
  conn:{url:'',key:''},ui:{unit:'kg',lastBm:''},lastSync:'',lastPullTs:'',lastUser:'',sheetUrl:'',scriptVer:''}}
function loadDB(){
  invalidate();
  try{const s=localStorage.getItem(LS_KEY);DB=s?JSON.parse(s):blankDB()}catch(e){DB=blankDB()}
  const b=blankDB();Object.keys(b).forEach(k=>{if(DB[k]==null)DB[k]=b[k]});
  if(!DB.ui)DB.ui={unit:'kg',lastBm:''};
  // settings-version bump forces defaults back (keeps entries and users)
  if(DB.sv!==SETTINGS_VERSION){DB.sv=SETTINGS_VERSION;DB.conn={url:'',key:''}}
  // make sure the built-in users exist (a Sheet copy with a newer timestamp still wins)
  DB.users=DB.users.filter(u=>u.id!=='admin'||u.upd!==EPOCH);
  // built-in users that nobody has edited yet take the current defaults (new passwords); edited ones are left alone
  seedUsers().forEach(s=>{const ex=DB.users.find(u=>String(u.id).toLowerCase()===s.id.toLowerCase());
    if(!ex)DB.users.push(s);else if(String(ex.upd)<SEED_TS)Object.assign(ex,s)});
  // base materials + grits per base material: un-edited old lists take the new defaults
  const bmr=DB.config.find(c=>c.id==='baseMaterials');
  if(bmr&&String(bmr.upd)<SEED_TS2){
    const used=[...DB.inward,...DB.sales].filter(r=>!r.del).map(r=>r.bm);
    bmr.val=JSON.stringify([...new Set([...DEFAULT_BM,...used])]);bmr.upd=SEED_TS2}
  getBM().forEach(b=>{const k='g:'+b;let r=DB.config.find(c=>c.id===k);
    const gs=DEFAULT_MAP[b]||[];
    const used=[...new Set([...DB.inward,...DB.sales].filter(x=>!x.del&&x.bm===b).map(x=>x.grade))];
    if(!r)DB.config.push({id:k,val:JSON.stringify([...new Set([...gs,...used])]),upd:SEED_TS2});
    else if(String(r.upd)<SEED_TS2){r.val=JSON.stringify([...new Set([...gs,...used])]);r.upd=SEED_TS2}});
  const pr=DB.config.find(c=>c.id==='pwHash');
  if(pr&&String(pr.upd)<SEED_TS){pr.val=hashPw(DEFAULT_SETTINGS_PW);pr.upd=SEED_TS}
}

// data actually changes. Every path that edits DB ends in saveDB(), so clearing the caches there

let _stock=null,_stockVals=null,_gritRank=null,_bms=null,_bmRank=null,_lastPersist=0;

// somebody writes to the Sheet, so without this an entry saved here would sit unsent until the
// next full sync: the revision would match, and we would skip the pull that pushes it.
let DIRTY=false;
function invalidate(){_stock=null;_stockVals=null;_gritRank=null;_bms=null;_bmRank=null}
// soft=true means nothing in the data changed (a sync that found no news), so skip the write:
// saveDB() is a full JSON.stringify of the database on the main thread.
function saveDB(soft){
  invalidate();

  if(soft&&Date.now()-_lastPersist<300000)return;
  try{localStorage.setItem(LS_KEY,JSON.stringify(DB));_lastPersist=Date.now()}catch(e){toast('Phone storage is full, free some space','err')}}
const getURL=()=>APPS_SCRIPT_URL||DB.conn.url||'';
const getKey=()=>APPS_SCRIPT_URL?API_KEY:(DB.conn.key||API_KEY);
function cfg(k){const r=DB.config.find(c=>c.id===k);return r?r.val:''}
function cfgSet(k,v){let r=DB.config.find(c=>c.id===k);if(!r){r={id:k,val:'',upd:''};DB.config.push(r)}r.val=v;r.upd=now()}
function getBM(){if(_bms)return _bms;try{const a=JSON.parse(cfg('baseMaterials'));_bms=Array.isArray(a)?a:DEFAULT_BM}catch(e){_bms=DEFAULT_BM}return _bms}
const pwOK=s=>hashPw(s)===cfg('pwHash');
function logTx(action,target,det){DB.log.push({id:uid(),ts:now(),user:ME?ME.id:'system',action,target:target||'',det:det||''})}
function getGrits(bm){try{const a=JSON.parse(cfg('g:'+bm));if(Array.isArray(a))return a}catch(e){}return(DEFAULT_MAP[bm]||[]).slice()}
function allGrits(){const seen=new Set(),o=[];getBM().forEach(b=>getGrits(b).forEach(g=>{if(!seen.has(g)){seen.add(g);o.push(g)}}));return o}
// "5um", "5 micron", "5 µm" and "5 Mic" all mean the same grit; "200/F" = "200F"
function normG(s){return String(s||'').toLowerCase().replace(/[\s\/_\-]/g,'').replace(/[µμ]m?|micron|mic|um/g,'um')}
function findGrit(txt,list){const n=normG(txt);if(!n)return '';return list.find(g=>normG(g)===n)||''}
// cmpGrit is used as a sort comparator, so gradeRank runs hundreds of times per repaint:
// the grit order is built into a Map once instead of being rebuilt on every comparison.
function gritRank(){if(_gritRank)return _gritRank;const m=new Map();allGrits().forEach((g,i)=>m.set(g,i));return _gritRank=m}
const gradeRank=g=>{const i=gritRank().get(g);return i===undefined?999:i};
const cmpGrit=(a,b)=>gradeRank(a)-gradeRank(b)||String(a).localeCompare(String(b),undefined,{numeric:true});
const bkey=(bm,g,b)=>bm+'|'+g+'|'+(b||'');
function calcStock(){
  if(_stock)return _stock;
  const m={};
  const add=(r,s)=>{if(r.del)return;const k=bkey(r.bm,r.grade,r.batch);
    const o=m[k]||(m[k]={bm:r.bm,grade:r.grade,batch:r.batch||'',bal:0,inn:0,out:0});
    if(s>0)o.inn=r3(o.inn+r.qty);else o.out=r3(o.out+r.qty);o.bal=r3(o.bal+s*r.qty)};
  DB.inward.forEach(r=>add(r,1));DB.sales.forEach(r=>add(r,-1));return _stock=m}
const stockList=()=>_stockVals||(_stockVals=Object.values(calcStock()));
const stockOf=(bm,g,b)=>(calcStock()[bkey(bm,g,b)]||{bal:0}).bal;
const stockGrits=bm=>[...new Set(stockList().filter(o=>o.bm===bm&&o.bal>0.0005).map(o=>o.grade))].sort(cmpGrit);
const stockBatches=(bm,g)=>stockList().filter(o=>o.bm===bm&&o.grade===g&&o.bal>0.0005).sort((x,y)=>x.batch<y.batch?-1:x.batch>y.batch?1:0);

function toArr(sheet,rec){return SCHEMA[sheet].cols.map(c=>{const v=rec[c[1]];return v==null?'':v})}
function fromObj(sheet,o){const rec={};
  SCHEMA[sheet].cols.forEach(c=>{let v=o[c[0]];if(v==null)v='';rec[c[1]]=NUMF[c[1]]?(c[1]==='active'&&v===''?1:(Number(v)||0)):String(v)});
  return rec}
function submitToSheets(data){
  const f=document.createElement('iframe');f.name='hf_'+Date.now()+Math.random().toString(36).slice(2,5);f.style.display='none';document.body.appendChild(f);
  const fm=document.createElement('form');fm.method='POST';fm.action=getURL();fm.target=f.name;
  for(const[k,v]of Object.entries(data)){const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;fm.appendChild(i)}
  document.body.appendChild(fm);fm.submit();
  setTimeout(()=>{fm.remove();f.remove()},12000)}
function setSync(state,txt){
  const b=$('sync');b.className='sync '+state;
  $('synctxt').textContent=state==='busy'?'Syncing…':state==='local'?'Local only':state==='err'?'Sync error':
    (DB.lastSync?'Synced '+new Date(DB.lastSync).toTimeString().slice(0,5):'Synced');
  b.title=txt||''}
function scheduleSync(ms){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>sync(false),ms==null?1500:ms)}
async function pull(url,params){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),25000);
  const q=Object.keys(params||{}).map(k=>k+'='+encodeURIComponent(params[k])).join('&');
  try{const r=await fetch(url+(url.includes('?')?'&':'?')+(q?q+'&':'')+'key='+encodeURIComponent(getKey())+'&t='+Date.now(),{signal:ctl.signal});
    const j=await r.json();if(j.status!=='ok')throw new Error(j.message||'script error');return j}
  catch(e){throw new Error(e.name==='AbortError'?'timed out':e.message==='Failed to fetch'?'cannot reach the Sheet (offline, or the URL is wrong)':e.message)}
  finally{clearTimeout(to)}}
// Base materials, and the grits of each base material, live as ONE Config row holding a JSON list.
// Plain last-write-wins on that row means two people adding a grit at about the same time silently
// lose one of them, so the two lists are merged instead of overwritten.
// The trade-off: a grit removed on one phone comes back if another phone still has it and has not
// synced since. Remove it again once every phone is up to date, and it stays gone.
const isListCfg=id=>id==='baseMaterials'||String(id).slice(0,2)==='g:';
const isoAfter=s=>{const t=Date.parse(s);return isNaN(t)?now():new Date(t+1).toISOString()};
// null = not a pair of lists, caller should fall back to last-write-wins. true = we changed ours.
function mergeListCfg(l,r){
  let a,b;
  try{a=JSON.parse(l.val);b=JSON.parse(r.val)}catch(e){return null}
  if(!Array.isArray(a)||!Array.isArray(b))return null;
  const sa=new Set(a),sb=new Set(b);
  const ours=a.some(v=>!sb.has(v)),theirs=b.some(v=>!sa.has(v));
  if(theirs){const out=a.slice();b.forEach(v=>{if(!sa.has(v)){sa.add(v);out.push(v)}});l.val=JSON.stringify(out)}
  // we hold something the Sheet does not: make our stamp the newer one so this goes back up
  if(ours)l.upd=String(r.upd)>=now()?isoAfter(r.upd):now();
  else if(String(r.upd)>String(l.upd))l.upd=r.upd;
  return ours||theirs}   // same set on both sides: nothing touched, so no endless push-and-pull
function applyRemote(j){
  let changed=false;const remoteUpd={};
  Object.keys(SCHEMA).forEach(sh=>{
    // a tab this pull did not ask for is left alone: an empty list would read as "the Sheet has
    // none of these rows", and reconcilePush would try to push the lot back up
    if(!j.data||!j.data[sh])return;
    const S=SCHEMA[sh],loc=DB[S.k],map=new Map(loc.map(r=>[r.id,r])),ru=new Map();
    (j.data[sh]||[]).forEach(o=>{const r=fromObj(sh,o);if(!r.id)return;ru.set(r.id,r.upd||r.ts||'');
      const l=map.get(r.id);
      if(!l){loc.push(r);map.set(r.id,r);changed=true}
      else if(sh==='Config'&&isListCfg(r.id)){
        const res=mergeListCfg(l,r);
        if(res===null){if(String(r.upd)>String(l.upd)){Object.assign(l,r);changed=true}}
        else if(res)changed=true}
      else if(S.k!=='log'&&String(r.upd)>String(l.upd)){Object.assign(l,r);changed=true}});
    remoteUpd[sh]=ru});
  if(changed)invalidate();
  return{changed,remoteUpd}}
function reconcilePush(j,remoteUpd,since){
  const url=getURL();if(!url)return;let delay=0;const nowT=Date.now();
  Object.keys(SCHEMA).forEach(sh=>{
    const S=SCHEMA[sh],ru=remoteUpd[sh];
    if(!ru)return;                       // not pulled this time, so we know nothing about that tab
    const todo=[];
    let minLog='';if(sh==='Log'&&j.logTruncated){(j.data.Log||[]).forEach(o=>{if(!minLog||o['TIMESTAMP']<minLog)minLog=o['TIMESTAMP']})}
    DB[S.k].forEach(r=>{
      // after a partial pull we only know about rows changed since `since`. Anything older was
      // settled by an earlier full pull, which comes round every FULL_SYNC_MS anyway.
      if(since&&String(r.upd||r.ts||'')<=since)return;
      const sig=sh+':'+r.id+':'+(r.upd||r.ts||'');
      if(SYNC.sent.has(sig)&&nowT-SYNC.sent.get(sig)<120000)return;
      let need;
      if(S.k==='log')need=!ru.has(r.id)&&(!minLog||r.ts>=minLog);
      else need=!ru.has(r.id)||String(r.upd)>String(ru.get(r.id));
      if(need){todo.push(r);SYNC.sent.set(sig,nowT)}});
    for(let i=0;i<todo.length;i+=20){
      const chunk=todo.slice(i,i+20).map(r=>toArr(sh,r));
      setTimeout(()=>submitToSheets({key:getKey(),sheet:sh,rows:JSON.stringify(chunk)}),delay);delay+=700}});
  if(SYNC.sent.size>3000)SYNC.sent.clear()}
// The log grows forever and the whole database is written to localStorage as one string, so an old
// phone eventually hits the storage quota and stops saving. Keep the newest LOG_KEEP rows here and
// drop older ones ONLY once the Sheet is known to hold them: either the row came back in this pull,
// or the pull was truncated and the row is older than everything in that window (so it went up long ago).
function trimLog(ru,j){
  if(DB.log.length<=LOG_KEEP)return false;
  DB.log.sort((a,b)=>String(a.ts)<String(b.ts)?-1:String(a.ts)>String(b.ts)?1:0);
  let minLog='';
  if(j&&j.logTruncated)(j.data.Log||[]).forEach(o=>{if(!minLog||o['TIMESTAMP']<minLog)minLog=o['TIMESTAMP']});
  const extra=DB.log.length-LOG_KEEP;let drop=0;
  while(drop<extra){const l=DB.log[drop];
    if((ru&&ru.has(l.id))||(minLog&&String(l.ts)<minLog))drop++;else break}
  if(drop)DB.log=DB.log.slice(drop);
  return drop>0}
// Whose copy of a row wins is decided by comparing timestamps the phones themselves wrote, so a
// phone with a wrong clock loses edits it should have won, and nothing on screen says why.
function noteSkew(j){
  if(!j||!j.ts)return;
  const t=Date.parse(j.ts);if(isNaN(t))return;
  SKEW=t-Date.now();
  if(Math.abs(SKEW)>SKEW_MS&&!SKEW_WARNED){
    SKEW_WARNED=true;
    toast('This phone’s clock is about '+Math.round(Math.abs(SKEW)/60000)+' minutes '+(SKEW>0?'behind':'ahead')+
      '. Set Date & time to automatic, or entries made here can be overwritten by other phones.','err')}}
// Hands back the sync already running instead of dropping the call, so a caller that awaits this
// really does wait for the pull. A forced sync (manual, or the login screen checking for a user it
// does not know) queues behind the running one and then does its own full pull.
function sync(manual,quiet){
  if(SYNC.inflight)return manual?SYNC.inflight.then(()=>sync(manual,quiet),()=>sync(manual,quiet)):SYNC.inflight;
  const p=syncRun(manual,quiet).then(v=>{SYNC.inflight=null;return v},e=>{SYNC.inflight=null;throw e});
  SYNC.inflight=p;return p}
async function syncRun(manual,quiet){
  const say=(m,t)=>{if(manual&&!quiet)toast(m,t)};
  const url=getURL();
  if(!url){setSync('local','Set the Apps Script URL in Settings > Connection');say('No Sheet connected yet. Settings > Connection','err');return}
  SYNC.busy=true;setSync('busy');
  try{
    // A full pull fetches and reconciles everything. It is the safety net: it catches a write that
    // never landed, and a row somebody corrected in the Sheet by hand (which does not move the
    // revision stamp). Between full pulls we ask the one-line "has anything changed?" question and
    // usually stop there, which is what keeps the script off its daily runtime quota.
    let full=manual||LEGACY||!DB.lastPullTs||Date.now()-LAST_FULL>FULL_SYNC_MS;
    if(!full){
      const rv=await pull(url,{action:'rev'});
      noteSkew(rv);
      if(rv.rev===undefined){LEGACY=true;full=true}   // Code.gs older than v2.5: pull everything
      else{
        DB.scriptVer=rv.scriptVersion||DB.scriptVer||'';
        if(String(rv.rev)===String(REV)&&!DIRTY){     // nothing changed there, nothing waiting here
          DB.lastSync=now();saveDB(true);setSync('ok');
          say('Already up to date');
          return}
      }
    }
    // the Log is big and only needed on the log screen, so it is left out of routine pulls
    const wantLog=full&&(manual||!DB.lastSync||DB.log.length>LOG_KEEP||(TAB==='settings'&&SUB==='log'&&SET_OK));
    const since=full?'':new Date(Date.parse(DB.lastPullTs)-SINCE_MARGIN_MS).toISOString();
    const params={action:'all',sheets:Object.keys(SCHEMA).filter(s=>s!=='Log'||wantLog).join(',')};
    if(since)params.since=since;
    const j=await pull(url,params);
    noteSkew(j);
    DB.sheetUrl=j.sheetUrl||DB.sheetUrl||'';DB.scriptVer=j.scriptVersion||DB.scriptVer||'';
    if(j.rev===undefined)LEGACY=true;else{REV=String(j.rev);LEGACY=false}
    const{changed,remoteUpd}=applyRemote(j);
    reconcilePush(j,remoteUpd,since);
    const trimmed=wantLog?trimLog(remoteUpd.Log,j):false;
    if(full)LAST_FULL=Date.now();
    DB.lastPullTs=j.ts||DB.lastPullTs||now();
    DB.lastSync=now();saveDB(!(changed||trimmed));DIRTY=false;SYNC.busy=false;setSync('ok');
    if(ME){const me=findUser(ME.id);if(!userValid(me)){App.logout();toast('Your login was removed or disabled','err');return}ME=me}
    let warned=false;
    if(changed&&ME&&!LOCKED){App.refresh();warned=warnNegative()}
    if(!warned)say('Synced with Google Sheet')}
  catch(e){setSync('err',e.message);say('Sync failed: '+e.message,'err')}
  finally{SYNC.busy=false}}

// two people selling the same batch before their phones synced can push a batch below zero: say so loudly
function warnNegative(){

App.saveEdit=function(id){
  const kind=TAB,K=KIND[kind],r=findEntry(kind,id),isP=kind==='inward';if(!r||!checkPw())return;
  const date=$('e_date').value,qty=r3(parseFloat($('e_qty').value)),rem=$('e_rem').value.trim();

  if(!(qty>0))return toast('Enter a quantity greater than 0','err');
  if(isP&&!batch)return toast('Batch number is required','err');

/* ---- Data ---- */
function csvCell(v){let s=v==null?'':String(v);if(/^[0-9][0-9\-\/.]*$/.test(s)&&!/^\d+(\.\d+)?$/.test(s))s='="'+s+'"';return/[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function csvDownload(name,rows){
  const blob=new Blob(['﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'-'+today()+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function parseCSV(t){const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}else c+=ch}
  r.push(c);if(r.some(x=>x!==''))rows.push(r);return rows}
function secData(){
  $('sbody').innerHTML=`<div class="card"><h3>Export</h3><div class="btns">
   <button class="btn" onclick="App.exp('stock')">Stock CSV</button><button class="btn" onclick="App.exp('sales')">Sales CSV</button><button class="btn" onclick="App.exp('inward')">Production CSV</button><button class="btn" onclick="App.backup()">Backup (JSON)</button></div></div>
  <div class="card"><h3>Restore backup</h3><div class="mut sm">Merges a backup file into this phone. Newer records win; nothing is deleted.</div>
   <input type="file" id="imp_json" accept=".json,application/json" style="margin-top:8px"><button class="btn block" onclick="App.restore()">Restore backup</button></div>
  <div class="card"><h3 style="color:var(--red)">Clear all entries</h3><div class="mut sm">Marks every sale and inward entry as deleted (grits, users and the log stay). Type CLEAR to confirm.</div>
   <input id="clr" type="text" placeholder="CLEAR" autocapitalize="characters" style="margin-top:8px"><button class="btn red block" onclick="App.clearAll()">Clear all entries</button></div>`}
App.exp=function(w){
  if(w==='stock'){const rows=[['Base material','Grit','Batch no','Produced kg','Sold kg','Balance kg','Balance MT']];
    stockList().filter(o=>Math.abs(o.bal)>0.0005).sort((a,b)=>bmOrder(a.bm,b.bm)||cmpGrit(a.grade,b.grade)||(a.batch<b.batch?-1:a.batch>b.batch?1:0)).forEach(o=>rows.push([o.bm,o.grade,o.batch,o.inn,o.out,o.bal,r3(o.bal/1000)]));
    csvDownload('mgp-stock',rows);return}
  const rows=w==='sales'?[['Date','Base material','Grit','Batch no','Qty kg','Type','Customer','Remarks','User','Entered/updated']]:[['Date','Base material','Grit','Batch no','Qty kg','Remarks','User','Entered/updated']];
  DB[w].filter(r=>!r.del).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(r=>rows.push(w==='sales'?[r.date,r.bm,r.grade,r.batch,r.qty,r.type,r.cust,r.rem,r.user,r.upd]:[r.date,r.bm,r.grade,r.batch,r.qty,r.rem,r.user,r.upd]));
  csvDownload('mgp-'+(w==='sales'?'sales':'production'),rows)};
App.backup=function(){
  const d={app:APP_NAME,version:APP_VERSION,at:now(),data:{}};Object.keys(SCHEMA).forEach(s=>d.data[SCHEMA[s].k]=DB[SCHEMA[s].k]);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='mgp-inventory-backup-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)};
function readFile(id){return new Promise((res,rej)=>{const f=$(id).files[0];if(!f)return rej(new Error('Choose a file first'));const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Could not read the file'));r.readAsText(f)})}
App.restore=async function(){
  try{const d=JSON.parse(await readFile('imp_json'));if(!d.data)throw new Error('Not an MGP Inventory backup');
    let n=0;
    Object.keys(SCHEMA).forEach(s=>{const k=SCHEMA[s].k,rem=Array.isArray(d.data[k])?d.data[k]:[],loc=DB[k],map=new Map(loc.map(r=>[r.id,r]));
      rem.forEach(r=>{if(!r||!r.id)return;const l=map.get(r.id);if(!l){loc.push(r);n++}else if(k!=='log'&&String(r.upd)>String(l.upd)){Object.assign(l,r);n++}})});
    logTx('DATA_RESTORE','backup '+(d.at||''),n+' records merged');saveDB();scheduleSync();toast(n+' records merged');secData()}
  catch(e){toast(e.message,'err')}};
App.clearAll=function(){
  if($('clr').value.trim()!=='CLEAR')return toast('Type CLEAR to confirm','err');
  let n=0;['inward','sales'].forEach(k=>DB[k].forEach(r=>{if(!r.del){r.del=1;r.upd=now();n++}}));
  logTx('DATA_CLEAR','all entries',n+' entries marked deleted');saveDB();scheduleSync();toast(n+' entries cleared');secData()};

/* ---- Connection ---- */
const sheetLink=()=>SHEET_URL||DB.sheetUrl||'';
App.copyLink=function(){const u=sheetLink();try{navigator.clipboard.writeText(u).then(()=>toast('Link copied'),()=>prompt('Copy this link',u))}catch(e){prompt('Copy this link',u)}};
function secConn(){
  const fixed=!!APPS_SCRIPT_URL,lk=sheetLink();
  $('sbody').innerHTML=`<div class="card"><h3>📊 Google Sheet (your database)</h3>
   ${lk?`<div class="btns" style="margin-top:0"><a class="btn pri" href="${esc(lk)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Open Google Sheet</a><button class="btn" onclick="App.copyLink()">Copy link</button></div><div class="mut sm" style="margin-top:8px;word-break:break-all">${esc(lk)}</div>`:`<div class="mut">The link appears here after the first successful sync with the latest Code.gs.</div>`}
   <div class="mut sm" style="margin-top:8px">Script version: ${DB.scriptVer?esc(DB.scriptVer):'old or not reached yet. Paste the latest Code.gs and deploy a new version.'}</div></div>
  <div class="card"><h3>Google Sheet connection</h3>
   ${fixed?'<div class="mut sm">The Apps Script URL is built into this app version.</div>':`<label>Apps Script /exec URL</label><input id="c_url" type="url" value="${esc(DB.conn.url)}" placeholder="https://script.google.com/macros/s/…/exec">
   <label>API key (same as API_KEY in Code.gs)</label><input id="c_key" type="text" value="${esc(DB.conn.key||API_KEY)}" autocapitalize="none">`}
   <div class="btns">${fixed?'':'<button class="btn pri" onclick="App.saveConn()">Save and sync</button>'}<button class="btn" onclick="App.sync(true)">🔄 Sync from Sheet</button></div>
   <div class="mut sm" style="margin-top:10px">Status: ${getURL()?'connected':'not connected (data lives only on this phone)'}<br>Last sync: ${DB.lastSync?ftime(DB.lastSync):'never'}${Math.abs(SKEW)>SKEW_MS?`<br><b style="color:var(--red)">This phone’s clock is about ${Math.round(Math.abs(SKEW)/60000)} minutes ${SKEW>0?'behind':'ahead'} of the Sheet. Set Date &amp; time to automatic, or entries made here can be overwritten by other phones.</b>`:''}<br>The app checks for changes every 30 seconds and does a full refresh every 5 minutes. Entries made offline are sent when the phone is back online.</div></div>`}
App.saveConn=function(){DB.conn.url=$('c_url').value.trim();DB.conn.key=$('c_key').value.trim()||API_KEY;saveDB();toast('Saved');sync(true);setTimeout(()=>{if(TAB==='settings'&&SUB==='conn'&&SET_OK)secConn()},1500)};

/* ---- Security ---- */
function secSec(){
  $('sbody').innerHTML=`<div class="card"><h3>Settings password</h3>
   <label>Current password</label><input id="p0" type="password" autocomplete="off">
   <label>New password (min 6)</label><input id="p1" type="password" autocomplete="new-password">
   <label>Repeat new password</label><input id="p2" type="password" autocomplete="new-password">
   <button class="btn pri block" onclick="App.changePw()">Change password</button>
   <div class="mut sm" style="margin-top:8px">This password is asked before Settings opens. It is shared across all phones through the Sheet.</div></div>`}
App.changePw=function(){
  if(!pwOK($('p0').value))return toast('Current password is wrong','err');
  const a=$('p1').value;if(a.length<6)return toast('New password must be at least 6 characters','err');
  if(a!==$('p2').value)return toast('The two new passwords do not match','err');
  cfgSet('pwHash',hashPw(a));logTx('PW_CHANGE','settings password','changed');saveDB();scheduleSync();toast('Password changed');secSec()};

/* ================= BOOT ================= */
// The logo is inlined once, as the apple-touch-icon (iOS reads that when the app is added to the home
// screen), and reused for the favicon and both <img> tags instead of being pasted in four times.
function wireIcons(){
  const l=document.querySelector('link[rel="apple-touch-icon"]');if(!l)return;
  const u=l.href;
  const ic=document.createElement('link');ic.rel='icon';ic.type='image/png';ic.href=u;document.head.appendChild(ic);
  document.querySelectorAll('img[data-logo]').forEach(i=>i.src=u)}
function boot(){
  loadDB();
  wireIcons();
  $('lg_ver').textContent=APP_VERSION+' · '+LAST_UPDATED;
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    // the worker now serves the cached app instantly and fetches the new one behind it, so this is
    // how the phone learns a newer version has landed and is ready on the next reload
    navigator.serviceWorker.addEventListener('message',ev=>{if(ev.data&&ev.data.type==='updated')$('upd').style.display='flex'});
  }
  initGoogle();
  // resume a login that is less than an hour old
  let ok=false;
  try{const o=JSON.parse(localStorage.getItem(SES_KEY)||'null');
    if(o&&Date.now()-o.at<LOCK_MS){const u=findUser(o.uid);if(userValid(u)){ok=true;ME=u;LOGIN_AT=o.at;
      if(ME.role==='stock')TAB='stock';
      $('login').style.display='none';$('app').style.display='block';renderChrome();render()}}}catch(e){}
  if(!ok)showLogin('');
  setSync(getURL()?(DB.lastSync?'ok':'err'):'local');
  if(getURL())scheduleSync(300);
}
window.App=App;window.lockApp=lockApp;
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
